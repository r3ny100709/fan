<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jaoka ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:Mali,sans-serif;color:#69536f;
  background:
    radial-gradient(circle at 10% 12%,#fff 0 3%,transparent 4%),
    radial-gradient(circle at 90% 18%,#ffffffc0 0 2.5%,transparent 3.5%),
    radial-gradient(circle at 15% 88%,#ffffffa6 0 2.5%,transparent 3.5%),
    linear-gradient(135deg,#ffd8eb,#f7e1ff 48%,#dceeff);
}

.chat-window{
  width:min(900px,96vw);height:min(900px,92vh);min-height:620px;
  display:flex;flex-direction:column;overflow:hidden;
  background:#ffffffc7;border:3px solid #fffffff2;border-radius:30px;
  box-shadow:0 25px 80px #a471ac40,inset 0 0 0 2px #f4b8dd80;
  backdrop-filter:blur(18px);
}

.top-bar{
  min-height:76px;padding:10px 18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,#f8afd0,#d0b9f2,#adddf4);
  border-bottom:2px solid #ffffffbf;
}

.profile{display:flex;align-items:center;gap:12px;min-width:0}

.profile-image{
  width:50px;height:50px;flex-shrink:0;border-radius:50%;
  object-fit:cover;background:#ffd7e9;border:3px solid #fffffff2;
  box-shadow:0 5px 15px #af78aa33;
}

.profile-info{min-width:0}

.profile-name{
  border:0;background:none;padding:0;cursor:pointer;
  font:25px/1 Itim,cursive;color:#7d5d82;
}

.profile-name:active{transform:scale(.96)}

.profile-status{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  color:#8d718f;font-size:12px;
}

.status-dot{
  width:9px;height:9px;flex-shrink:0;border-radius:50%;
  background:#ff91bd;box-shadow:0 0 8px #ff91bdc0;
}

.window-dots{display:flex;gap:7px}

.window-dots span{
  width:11px;height:11px;border-radius:50%;background:#ffffffd1;
}

.chat-area{
  position:relative;flex:1;min-height:0;padding:20px 18px;
  background:linear-gradient(180deg,#fff7fcba,#f4f6ffad);
}

.messages{
  width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
  padding:4px 12px 18px;scroll-behavior:smooth;
  overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:#e7a9c8 #ffffff73;
}

.messages::-webkit-scrollbar{width:9px}

.messages::-webkit-scrollbar-track{
  background:#ffffff73;border-radius:20px
}

.messages::-webkit-scrollbar-thumb{
  background:linear-gradient(#f1a6c8,#bca9e8);
  border-radius:20px;border:2px solid #ffffff80;
}

.message-row{
  display:flex;
  width:100%;
  margin:7px 0;
}

.message-row.mine{
  justify-content:flex-start;
}

.message-row.theirs{
  justify-content:flex-end;
}

.message-bubble{
  position:relative;
  max-width:min(72%,600px);
  padding:12px 16px;
  border-radius:20px;
  line-height:1.75;
  font-size:15px;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  box-shadow:0 4px 13px #82649114;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  cursor:pointer;
  touch-action:pan-y;
}

.mine .message-bubble{
  color:#76576b;
  background:linear-gradient(135deg,#ffd1e5,#f8c4df);
  border:1px solid #ef9bc18c;
  border-bottom-left-radius:6px;
}

.theirs .message-bubble{
  color:#5b6475;
  background:linear-gradient(135deg,#d5ecff,#c8e4fa);
  border:1px solid #91c4e88c;
  border-bottom-right-radius:6px;
}

.message-time{
  margin-top:5px;
  font-size:10px;
  line-height:1.2;
  opacity:.62;
}

.mine .message-time{text-align:left}
.theirs .message-time{text-align:right}


/* =========================================
   กำลังลบ
========================================= */

.message-bubble.holding{
  transform:scale(.97);
  filter:brightness(.96);
}

.message-bubble.holding::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:inherit;
  border:3px solid transparent;
  border-top-color:#ff8fbd;
  border-right-color:#ff8fbd;
  animation:deleteProgress 5s linear forwards;
  pointer-events:none;
}

@keyframes deleteProgress{
  0%{
    transform:rotate(-45deg);
    opacity:.5;
  }

  100%{
    transform:rotate(315deg);
    opacity:1;
  }
}


.empty-chat{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#b99eb9;
  font-size:14px;
  line-height:1.8;
}

.empty-chat span{
  display:block;
  font-size:38px;
  margin-bottom:8px;
}


.scroll-bottom{
  position:absolute;
  right:25px;
  bottom:25px;
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:50%;
  background:#fffffff2;
  color:#b77ca5;
  font-size:19px;
  cursor:pointer;
  box-shadow:0 6px 18px #82649133;
  opacity:0;
  pointer-events:none;
  transform:translateY(8px);
  transition:.2s;
}

.scroll-bottom.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}


.input-area{
  flex-shrink:0;
  padding:13px 16px 15px;
  background:#ffffffd4;
  border-top:2px solid #ffffffe6;
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:9px;
}

.message-input{
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:130px;
  resize:none;
  padding:12px 16px;
  border:2px solid #efd6e7;
  border-radius:21px;
  outline:0;
  background:#fffafd;
  color:#66566b;
  font:14px/1.65 Mali;
  overflow-y:auto;
  transition:.2s;
}

.message-input::placeholder{
  color:#c3a9c1;
}

.message-input:focus{
  border-color:#dfa7c9;
  background:#fff;
  box-shadow:0 0 0 4px #dfa7c91f;
}

.send-button{
  width:52px;
  height:48px;
  flex-shrink:0;
  border:0;
  border-radius:19px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  color:#fff;
  background:linear-gradient(135deg,#f39fc4,#b99fe7);
  box-shadow:0 6px 15px #bc84be40;
  transition:.2s;
}

.send-button:hover{
  transform:translateY(-2px);
}

.send-button:active{
  transform:scale(.95);
}

.send-button:disabled{
  opacity:.55;
  cursor:wait;
}


.connection-status{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  padding:6px 13px;
  border-radius:20px;
  background:#fffffff0;
  color:#a980a4;
  font-size:10px;
  box-shadow:0 4px 15px #8264911f;
  display:none;
}


@media(max-width:600px){

  body{
    padding:8px;
  }

  .chat-window{
    width:100%;
    height:calc(100vh - 16px);
    min-height:500px;
    border-radius:23px;
  }

  .top-bar{
    min-height:68px;
    padding:8px 13px;
  }

  .profile-image{
    width:43px;
    height:43px;
  }

  .profile-name{
    font-size:22px;
  }

  .profile-status{
    font-size:10px;
  }

  .chat-area{
    padding:12px 8px;
  }

  .messages{
    padding:3px 6px 15px;
  }

  .message-bubble{
    max-width:82%;
    font-size:14px;
    padding:10px 13px;
    line-height:1.7;
  }

  .input-area{
    padding:10px;
  }

  .message-input{
    font-size:14px;
  }

  .send-button{
    width:48px;
    height:47px;
  }

  .scroll-bottom{
    right:18px;
    bottom:18px;
    width:40px;
    height:40px;
  }

}


@media(prefers-reduced-motion:reduce){

  *{
    scroll-behavior:auto!important;
    transition:none!important;
  }

}
</style>
</head>

<body>

<main class="chat-window">

<header class="top-bar">

  <div class="profile">

    <img
      class="profile-image"
      src="./EF49275A-74C1-46A1-AECC-04F296D98CB0.gif"
      alt="Jaoka"
    >

    <div class="profile-info">

      <button
        class="profile-name"
        id="profileName"
        type="button"
      >
        Jaoka
      </button>

      <div class="profile-status">
        <span class="status-dot"></span>
        <span>obsessed</span>
      </div>

    </div>

  </div>

  <div class="window-dots">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>


<section class="chat-area">

  <div
    class="connection-status"
    id="connectionStatus"
  >
    กำลังเชื่อมต่อ...
  </div>

  <div
    class="messages"
    id="messages"
  >

    <div
      class="empty-chat"
      id="emptyChat"
    >
      <div>
        <span>♡</span>
        เริ่มคุยกันตรงนี้นะ
      </div>
    </div>

  </div>

  <button
    class="scroll-bottom"
    id="scrollBottom"
    type="button"
    aria-label="ไปข้อความล่าสุด"
  >
    ↓
  </button>

</section>


<footer class="input-area">

  <div class="input-box">

    <textarea
      id="messageInput"
      class="message-input"
      maxlength="3000"
      rows="1"
      placeholder="พิมพ์ข้อความ..."
    ></textarea>

    <button
      class="send-button"
      id="sendButton"
      type="button"
      aria-label="ส่งข้อความ"
    >
      ♡
    </button>

  </div>

</footer>

</main>


<script type="module">

import{initializeApp}
from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import{
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
  apiKey:"AIzaSyBkxDeR-IgljHiFbczQOlvUDtoz7z5xxh4",
  authDomain:"jaokanjump.firebaseapp.com",
  projectId:"jaokanjump",
  storageBucket:"jaokanjump.firebasestorage.app",
  messagingSenderId:"137877435934",
  appId:"1:137877435934:web:3160d245dd411917e2200f",
  measurementId:"G-1HQ7045XKF"
};

const db=getFirestore(
  initializeApp(firebaseConfig)
);


/* ELEMENTS */

const messages=document.getElementById("messages");
const input=document.getElementById("messageInput");
const send=document.getElementById("sendButton");
const down=document.getElementById("scrollBottom");
const empty=document.getElementById("emptyChat");
const status=document.getElementById("connectionStatus");
const name=document.getElementById("profileName");


/* IDENTITY */

const IDENTITY_KEY="jaoka_chat_identity_v2";

let identity=
  localStorage.getItem(IDENTITY_KEY)||"them";


name.addEventListener("click",()=>{

  identity=
    identity==="them"
      ?"me"
      :"them";

  localStorage.setItem(
    IDENTITY_KEY,
    identity
  );

});


/* HELPERS */

function nearBottom(){

  return(
    messages.scrollHeight-
    messages.scrollTop-
    messages.clientHeight
  )<120;

}


function scrollDown(smooth=true){

  messages.scrollTo({
    top:messages.scrollHeight,
    behavior:smooth?"smooth":"auto"
  });

}


function formatTime(timestamp){

  if(!timestamp)return"";

  try{

    const date=
      timestamp.toDate
        ?timestamp.toDate()
        :new Date(timestamp);

    return date.toLocaleTimeString(
      "th-TH",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return"";

  }

}


function updateScrollButton(){

  down.classList.toggle(
    "show",
    !nearBottom()
  );

}


messages.addEventListener(
  "scroll",
  updateScrollButton
);


down.addEventListener(
  "click",
  ()=>scrollDown()
);


/* =========================================
   LONG PRESS DELETE
   ลบได้ทั้งฝั่งซ้ายและขวา
========================================= */

const HOLD_TIME=5000;

let holdTimer=null;
let holdBubble=null;
let holdPointer=null;


function cancelHold(){

  if(holdTimer){

    clearTimeout(holdTimer);

    holdTimer=null;

  }

  if(holdBubble){

    holdBubble.classList.remove(
      "holding"
    );

    holdBubble=null;

  }

  holdPointer=null;

}


function startHold(
  event,
  bubble,
  messageId
){

  /*
     ตอนนี้ไม่เช็ก identity แล้ว
     ดังนั้นข้อความทั้งฝั่งซ้ายและขวา
     สามารถกดค้างเพื่อลบได้
  */

  if(
    event.pointerType==="mouse" &&
    event.button!==0
  ){

    return;

  }

  cancelHold();

  holdBubble=bubble;
  holdPointer=event.pointerId;

  bubble.classList.add("holding");

  holdTimer=setTimeout(
    async()=>{

      holdTimer=null;

      bubble.classList.remove(
        "holding"
      );

      try{

        await deleteDoc(
          doc(
            db,
            "jaoka_chat",
            messageId
          )
        );

      }catch(error){

        console.error(
          "Delete error:",
          error
        );

        alert(
          "ลบข้อความไม่สำเร็จ"
        );

      }

      holdBubble=null;
      holdPointer=null;

    },
    HOLD_TIME
  );

}


messages.addEventListener(
  "pointerdown",
  event=>{

    const bubble=
      event.target.closest(
        ".message-bubble"
      );

    if(!bubble)return;

    const row=
      bubble.closest(
        ".message-row"
      );

    if(!row)return;

    startHold(
      event,
      bubble,
      row.dataset.id
    );

  }
);


messages.addEventListener(
  "pointerup",
  cancelHold
);


messages.addEventListener(
  "pointercancel",
  cancelHold
);


messages.addEventListener(
  "pointerleave",
  cancelHold
);


/* RENDER */

function render(snapshot){

  const stick=nearBottom();

  messages.innerHTML="";

  if(snapshot.empty){

    messages.appendChild(empty);

    empty.style.display="flex";

    updateScrollButton();

    return;

  }


  snapshot.forEach(docSnap=>{

    const data=docSnap.data();

    const row=
      document.createElement("div");

    const bubble=
      document.createElement("div");

    const clock=
      document.createElement("div");


    row.className=
      "message-row "+
      (
        data.sender==="me"
          ?"mine"
          :"theirs"
      );

    row.dataset.id=
      docSnap.id;

    row.dataset.sender=
      data.sender||"";


    bubble.className=
      "message-bubble";

    bubble.textContent=
      data.text||"";


    clock.className=
      "message-time";

    clock.textContent=
      formatTime(
        data.createdAt
      );


    bubble.appendChild(clock);

    row.appendChild(bubble);

    messages.appendChild(row);

  });


  if(stick){

    requestAnimationFrame(
      ()=>scrollDown(false)
    );

  }


  updateScrollButton();

}


/* FIRESTORE */

const chat=query(
  collection(db,"jaoka_chat"),
  orderBy("createdAt","asc")
);

status.style.display="block";


onSnapshot(
  chat,

  snapshot=>{

    status.style.display="none";

    render(snapshot);

  },

  error=>{

    console.error(
      "Firestore error:",
      error
    );

    status.textContent=
      "เชื่อมต่อแชทไม่ได้";

    status.style.display="block";

  }
);


/* SEND */

async function sendMessage(){

  const text=input.value;

  if(!text.trim()){

    input.focus();

    return;

  }


  send.disabled=true;


  try{

    await addDoc(
      collection(
        db,
        "jaoka_chat"
      ),
      {
        text:text,
        sender:identity,
        createdAt:serverTimestamp()
      }
    );


    input.value="";

    resizeInput();

    input.focus();

    setTimeout(
      ()=>scrollDown(),
      100
    );

  }catch(error){

    console.error(
      "Send error:",
      error
    );

    alert(
      "ส่งข้อความไม่สำเร็จ\n\n"+
      "เช็ก Firestore Rules ก่อนนะ"
    );

  }finally{

    send.disabled=false;

  }

}


send.addEventListener(
  "click",
  sendMessage
);


/* TEXTAREA */

function resizeInput(){

  input.style.height="auto";

  input.style.height=
    Math.min(
      input.scrollHeight,
      130
    )+"px";

}


input.addEventListener(
  "input",
  resizeInput
);


input.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter"&&
      (event.ctrlKey||event.metaKey)
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* INITIAL */

resizeInput();

setTimeout(
  ()=>scrollDown(false),
  300
);

</script>

</body>
</html>
