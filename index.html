<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBkxDeR-IgljHiFbczQOlvUDtoz7z5xxh4",

  authDomain:
    "jaokanjump.firebaseapp.com",

  projectId:
    "jaokanjump",

  storageBucket:
    "jaokanjump.firebasestorage.app",

  messagingSenderId:
    "137877435934",

  appId:
    "1:137877435934:web:3160d245dd411917e2200f",

  measurementId:
    "G-1HQ7045XKF"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const messagesBox =
  document.getElementById("messages");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const scrollBottom =
  document.getElementById("scrollBottom");

const emptyChat =
  document.getElementById("emptyChat");

const connectionStatus =
  document.getElementById("connectionStatus");

const meButton =
  document.getElementById("meButton");

const themButton =
  document.getElementById("themButton");

const identityLabel =
  document.getElementById("identityLabel");


/* =====================================================
   IDENTITY
===================================================== */

/*
   แต่ละเครื่องจำได้เองว่าเป็นใคร

   เครื่องของเรา:
   "me"

   เครื่องของเขา:
   "them"

   ถ้าเปิดครั้งแรกจะเป็น "me"
*/

const IDENTITY_KEY =
  "jaoka_chat_identity";

let identity =
  localStorage.getItem(IDENTITY_KEY) || "me";


function updateIdentityUI(){

  const isMe =
    identity === "me";


  meButton.classList.toggle(
    "active",
    isMe
  );


  themButton.classList.toggle(
    "active",
    !isMe
  );


  identityLabel.textContent =
    isMe
      ? "กำลังส่งในชื่อ: เรา"
      : "กำลังส่งในชื่อ: เขา";

}


meButton.addEventListener(
  "click",
  () => {

    identity = "me";

    localStorage.setItem(
      IDENTITY_KEY,
      identity
    );

    updateIdentityUI();

  }
);


themButton.addEventListener(
  "click",
  () => {

    identity = "them";

    localStorage.setItem(
      IDENTITY_KEY,
      identity
    );

    updateIdentityUI();

  }
);


updateIdentityUI();


/* =====================================================
   HELPERS
===================================================== */

function formatTime(timestamp){

  if(!timestamp){
    return "";
  }


  let date;


  try{

    date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

  }catch{

    return "";

  }


  return date.toLocaleTimeString(
    "th-TH",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   SCROLL
===================================================== */

function isNearBottom(){

  const distance =
    messagesBox.scrollHeight
    -
    messagesBox.scrollTop
    -
    messagesBox.clientHeight;


  return distance < 120;

}


function scrollToBottom(
  smooth = true
){

  messagesBox.scrollTo({

    top:
      messagesBox.scrollHeight,

    behavior:
      smooth
        ? "smooth"
        : "auto"

  });

}


function updateScrollButton(){

  if(isNearBottom()){

    scrollBottom.classList.remove(
      "show"
    );

  }else{

    scrollBottom.classList.add(
      "show"
    );

  }

}


messagesBox.addEventListener(
  "scroll",
  updateScrollButton
);


scrollBottom.addEventListener(
  "click",
  () => {

    scrollToBottom(true);

  }
);


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessages(
  snapshot
){

  const shouldStick =
    isNearBottom();


  messagesBox.innerHTML = "";


  if(snapshot.empty){

    messagesBox.appendChild(
      emptyChat
    );

    emptyChat.style.display =
      "flex";

    updateScrollButton();

    return;

  }


  snapshot.forEach(
    (docSnap) => {

      const data =
        docSnap.data();


      const row =
        document.createElement(
          "div"
        );


      const isMine =
        data.sender === "me";


      row.className =
        "message-row "
        +
        (
          isMine
            ? "mine"
            : "theirs"
        );


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "message-bubble";


      /*
         ใช้ textContent + pre-wrap
         เพื่อให้ข้อความหลายบรรทัด
         และช่องว่างปลอดภัย
      */

      bubble.textContent =
        data.text || "";


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "message-time";


      time.textContent =
        formatTime(
          data.createdAt
        );


      bubble.appendChild(
        time
      );


      row.appendChild(
        bubble
      );


      messagesBox.appendChild(
        row
      );

    }
  );


  if(shouldStick){

    requestAnimationFrame(
      () => scrollToBottom(false)
    );

  }


  updateScrollButton();

}


/* =====================================================
   REALTIME FIRESTORE
===================================================== */

const messagesQuery =
  query(
    collection(
      db,
      "jaoka_chat"
    ),
    orderBy(
      "createdAt",
      "asc"
    )
  );


connectionStatus.style.display =
  "block";


onSnapshot(

  messagesQuery,

  (snapshot) => {

    connectionStatus.style.display =
      "none";

    renderMessages(
      snapshot
    );

  },

  (error) => {

    console.error(
      "Firestore error:",
      error
    );


    connectionStatus.textContent =
      "เชื่อมต่อแชทไม่ได้";


    connectionStatus.style.display =
      "block";

  }

);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    input.value;


  if(
    text.trim().length === 0
  ){

    input.focus();

    return;

  }


  if(
    text.length > 3000
  ){

    alert(
      "ข้อความยาวเกิน 3000 ตัวอักษรนะ"
    );

    return;

  }


  sendButton.disabled =
    true;


  try{

    await addDoc(

      collection(
        db,
        "jaoka_chat"
      ),

      {

        text:
          text,

        sender:
          identity,

        createdAt:
          serverTimestamp()

      }

    );


    input.value = "";

    resizeInput();

    input.focus();


    /*
       หลังส่งให้กลับไปข้อความล่าสุด
    */

    setTimeout(
      () => scrollToBottom(true),
      100
    );


  }catch(error){

    console.error(
      "Send error:",
      error
    );


    alert(
      "ส่งข้อความไม่สำเร็จ\n\n"
      +
      "เช็ก Firestore Rules ก่อนนะ"
    );

  }finally{

    sendButton.disabled =
      false;

  }

}


sendButton.addEventListener(
  "click",
  sendMessage
);


/* =====================================================
   TEXTAREA
===================================================== */

function resizeInput(){

  input.style.height =
    "auto";


  const height =
    Math.min(
      input.scrollHeight,
      130
    );


  input.style.height =
    height + "px";

}


input.addEventListener(
  "input",
  resizeInput
);


/*
   Enter = ขึ้นบรรทัดใหม่

   Shift + Enter = ขึ้นบรรทัดใหม่เหมือนกัน

   Ctrl / Command + Enter = ส่ง
*/

input.addEventListener(
  "keydown",
  (event) => {

    if(
      event.key === "Enter"
      &&
      (
        event.ctrlKey
        ||
        event.metaKey
      )
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   INITIAL
===================================================== */

resizeInput();

setTimeout(
  () => {

    scrollToBottom(false);

  },
  300
);


</script>

</html>
